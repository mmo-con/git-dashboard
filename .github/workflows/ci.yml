name: CI

on:
  # Pull requests test feature branches; push runs only for main and
  # version tags, so a branch with an open pull request is not tested twice.
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # New advisories appear without code changes.
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.name }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 ships Git 2.34, the minimum supported version.
          - name: git 2.34
            os: ubuntu-latest
            container: ubuntu:22.04
          - name: latest git
            os: ubuntu-latest
            container: ""
          - name: macos
            os: macos-latest
            container: ""
    steps:
      - name: Install Git and build tools (container)
        if: matrix.container != ''
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates make gcc libc6-dev
      - name: Install latest Git
        if: matrix.name == 'latest git'
        run: |
          sudo add-apt-repository -y ppa:git-core/ppa
          sudo apt-get update && sudo apt-get install -y git
      - uses: actions/checkout@v7
      # In a container the checkout belongs to another user; without this, Git
      # refuses the repository and go list fails on VCS stamping.
      - name: Trust the checkout (container)
        if: matrix.container != ''
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: git --version
      - run: make lint
      - run: make test-installer
      - name: Test with race detector and coverage
        run: make coverage
      - name: Write coverage to the job summary
        run: |
          echo "**${{ matrix.name }}**" >> "$GITHUB_STEP_SUMMARY"
          sh scripts/coverage-summary.sh coverage.out >> "$GITHUB_STEP_SUMMARY"

  # Scans with the toolchain that builds the releases, not with the minimum
  # Go version from go.mod that the tests use.
  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache: false
      - run: go version
      - run: make vuln

  release:
    name: Create release draft
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [test, vuln]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Validate release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must have the form vMAJOR.MINOR.PATCH"
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache: false
      - run: go version
      - name: Build release archives
        run: |
          make release VERSION="$RELEASE_TAG"
          (cd dist && sha256sum -c checksums.txt)
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" \
            "dist/headquarters_${RELEASE_TAG}_linux_amd64.tar.gz" \
            "dist/headquarters_${RELEASE_TAG}_linux_arm64.tar.gz" \
            "dist/headquarters_${RELEASE_TAG}_darwin_amd64.tar.gz" \
            "dist/headquarters_${RELEASE_TAG}_darwin_arm64.tar.gz" \
            dist/checksums.txt dist/install.sh \
            --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
